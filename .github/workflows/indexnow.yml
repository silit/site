# Tells the IndexNow search engines (Bing, Yandex, Naver, Seznam, Yep and the others) which pages
# changed, right after each production deploy on Vercel. Google does not use IndexNow; Search Console
# covers Google. Run it by hand from the Actions tab with "Run workflow".
name: IndexNow

on:
  # A push to main is a production deploy on Vercel. The job waits until Vercel reports it as finished.
  # (A run started by Vercel's commit status cannot keep anything for the next run: GitHub gives such
  # runs read-only storage, so every run compared the site with the same old fingerprints.)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read # to see when Vercel has finished the deploy
  actions: read # to fetch the page fingerprints the last run kept

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for Vercel to finish the deploy
        id: deploy
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          for i in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '[.statuses[] | select(.context | startswith("Vercel"))][0].state // "none"' || echo "none")
            echo "Vercel: $state"
            if [ "$state" = "success" ]; then
              sleep 30 # for the deploy to reach silitlabs.com
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then break; fi
            sleep 10
          done
          echo "::notice::No finished deploy for this commit (Vercel: $state), so nothing is submitted."
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Restore page fingerprints from the last run
        if: steps.deploy.outputs.ready == 'true'
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=indexnow-pages&per_page=100" --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then echo "No fingerprints kept yet."; exit 0; fi
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -o "$RUNNER_TEMP/indexnow-pages.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip"
          mkdir -p .indexnow
          unzip -o -q "$RUNNER_TEMP/indexnow-pages.zip" -d .indexnow
          echo "Fingerprints restored from artifact $id."

      - name: Submit new, changed and removed pages
        if: steps.deploy.outputs.ready == 'true'
        run: node scripts/indexnow.mjs

      - name: Keep page fingerprints for the next run
        if: steps.deploy.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-pages
          path: .indexnow/pages.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
